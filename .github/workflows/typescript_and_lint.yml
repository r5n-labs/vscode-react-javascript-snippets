name: Typescript & lint

permissions:
  contents: read

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run audit

      - name: Lint
        run: bun run lint

      - name: Typescript
        run: bun run typescript

      - name: Test
        run: bun test

      - name: Verify generated snippets
        run: bun run generate:check
